x-service-env: &service-env
  REDIS_URL: redis://redis:6379
  SHARED_DB_URL: postgresql://busly:password@postgres:5432/busly
  DB_USER: busly
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: "5432"
  ASYNC_PREFIX: postgresql+asyncpg://busly:password@postgres:5432
  BROKER_URL: amqp://guest:guest@rabbitmq:5672/
  RESULT_BACKEND: redis://redis:6379/0
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

services:
  postgres:
    restart: unless-stopped
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: busly
      POSTGRES_PASSWORD: password
      POSTGRES_DB: busly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6380:6379"

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *service-env
    ports:
      - "8000:8000"
    volumes:
      - /etc/keys:/etc/keys:ro
    depends_on:
      - postgres
      - redis
      - auth-service
      - fleet-service
      - routing-service
      - geo-service
      - student-service
      - notification-service
      - tenant-service

  auth-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.auth.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *service-env
    volumes:
      - /etc/keys:/etc/keys:ro
    depends_on:
      - postgres
      - redis

  fleet-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.fleet.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *service-env
    volumes:
      - report_files:/var/busly/reports
    depends_on:
      - postgres
      - redis

  routing-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.routing.main:app --host 0.0.0.0 --port 8003
    environment:
      <<: *service-env
    depends_on:
      - postgres
      - redis

  geo-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.geo.main:app --host 0.0.0.0 --port 8005
    environment:
      <<: *service-env
    depends_on:
      - postgres
      - redis

  student-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.students.main:app --host 0.0.0.0 --port 8004
    environment:
      <<: *service-env
    depends_on:
      - postgres
      - redis

  notification-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.notifications.main:app --host 0.0.0.0 --port 8008
    environment:
      <<: *service-env
    depends_on:
      - postgres
      - redis

  tenant-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.services.tenant.main:app --host 0.0.0.0 --port 8006
    environment:
      <<: *service-env
    depends_on:
      - postgres
      - redis

  celery-worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app worker --loglevel=info
    depends_on:
      - rabbitmq
      - redis
    environment:
      <<: *service-env
    volumes:
      - report_files:/var/busly/reports

  # Optional public URL for the API (free, no account, no card).
  # Started only with: docker compose --profile tunnel up -d
  # Prints a https://<random>.trycloudflare.com URL in its logs.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://gateway:8000
    restart: unless-stopped
    depends_on:
      - gateway
    profiles:
      - tunnel

volumes:
  postgres_data:
  report_files:
